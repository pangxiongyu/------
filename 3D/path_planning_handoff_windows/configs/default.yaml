paths:
  weather_map: data/weather_cost_map/weather_cost_map_sample_24h.csv
  dynamic_profiles: data/uav_profiles/torch_mamba_uav_dynamic_profiles.csv
  tasks: data/tasks/demo_tasks.csv

scenario:
  time_index: 0
  height_m: 10
  uav_count: 3
  max_profile_risk: medium
  uav_start_strategy: low_cost
  payload_capacity_margin_g: 300

baseline:
  allow_high_risk: false
  weather_grid_weight: 20.0

marl:
  max_steps: 4
  conflict_penalty: 50
  wait_penalty: 1
  use_height_actions: true
  use_weather_grid_paths: true
  route_strategies:
    - direct
    - weather_grid
    - weather_3d
  reward:
    task_complete_reward: 100.0
    distance_weight: 10.0
    weather_weight: 20.0
    energy_weight: 5.0
    risk_weight: 1.0
    path_cost_weight: 0.0
    trackability_weight: 0.0
    max_distance_km: 1500.0
    max_path_cost: 12000.0
    max_trackable_segment_km: 1000.0

mappo:
  episodes: 3
  ppo_epochs: 2
  gamma: 0.95
  clip_ratio: 0.2
  learning_rate: 0.0003
  reward_scale: 0.01
  normalize_value_targets: true
  mask_wait_when_tasks_available: true
  eval_episodes: 3
  eval_interval: 1
  checkpoint_selection_mode: reward
  seed: 7

mpc:
  controller: qp
  dt: 1.0
  horizon: 6
  max_acc: 3.0
  max_speed: 20.0
  min_height_m: 0.0
  max_height_m: 120.0
  steps_per_segment: 25
  coordinate_scale: 0.001
