base_config: configs/default.yaml
output_dir: outputs/mappo_long_experiments

experiments:
  - name: seed11_e30_lr3e4
    overrides:
      mappo:
        seed: 11
        episodes: 30
        ppo_epochs: 2
        learning_rate: 0.0003
        reward_scale: 0.01
