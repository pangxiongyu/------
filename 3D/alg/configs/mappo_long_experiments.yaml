        seed: 11
        episodes: 50
        ppo_epochs: 2
        learning_rate: 0.0003
        reward_scale: 0.01
        eval_interval: 5
        eval_episodes: 3

  - name: seed11_e100_lr1e4
    overrides:
      mappo:
        seed: 11
        episodes: 100
        ppo_epochs: 2
        learning_rate: 0.0001
