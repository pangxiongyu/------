base_config: configs/default.yaml
validation_suite: configs/mappo_validation_same_action.yaml
output_dir: outputs/mappo_trackability_sweep
selection_mode: trackability
checkpoint_selection_mode: trackability

experiments:
  - name: pathcost_w50_track_w25_e30
    overrides:
      mappo:
        seed: 13
        episodes: 30
        ppo_epochs: 2
        learning_rate: 0.0003
        reward_scale: 0.01
        eval_interval: 5
        eval_episodes: 2
        checkpoint_selection_mode: path_cost
      marl:
        reward:
          task_complete_reward: 100.0
          distance_weight: 10.0
          weather_weight: 20.0
          energy_weight: 5.0
          risk_weight: 1.0
          path_cost_weight: 50.0
          trackability_weight: 25.0
          max_distance_km: 1500.0
          max_path_cost: 12000.0
          max_trackable_segment_km: 1000.0

  - name: pathcost_w50_track_w50_e30
    overrides:
      mappo:
        seed: 13
        episodes: 30
        ppo_epochs: 2
        learning_rate: 0.0003
        reward_scale: 0.01
        eval_interval: 5
        eval_episodes: 2
        checkpoint_selection_mode: path_cost
      marl:
        reward:
          task_complete_reward: 100.0
          distance_weight: 10.0
          weather_weight: 20.0
          energy_weight: 5.0
          risk_weight: 1.0
          path_cost_weight: 50.0
          trackability_weight: 50.0
          max_distance_km: 1500.0
          max_path_cost: 12000.0
          max_trackable_segment_km: 1000.0
